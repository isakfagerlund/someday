name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare preview secrets
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";

            const names = [
              "OPENAI_API_KEY",
              "CLERK_SECRET_KEY",
              "CLERK_PUBLISHABLE_KEY",
              "CLERK_JWT_KEY",
            ];
            const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]));

            if (Object.values(secrets).some((value) => !value)) {
              throw new Error("A preview secret is missing");
            }

            writeFileSync(process.env.PREVIEW_SECRETS_FILE, JSON.stringify(secrets));
          '
        env:
          PREVIEW_SECRETS_FILE: ${{ runner.temp }}/preview-secrets.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}

      - name: Deploy preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name someday-pr-${{ github.event.pull_request.number }} --secrets-file ${{ runner.temp }}/preview-secrets.json

      - name: Check preview health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "${PREVIEW_URL%/}/health"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Delete preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name someday-pr-${{ github.event.pull_request.number }}
