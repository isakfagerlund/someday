name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Upload preview version
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: pnpm run build
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --tag pr-${{ github.event.pull_request.number }}

      - name: Check preview health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "${PREVIEW_URL%/}/health"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}

      - name: Add preview link to pull request
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = "<!-- cloudflare-pr-preview -->"
            const body = [
              marker,
              "### Cloudflare preview",
              "",
              `[Open preview](${process.env.PREVIEW_URL})`,
              "",
              `Updated for \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`,
            ].join("\n")
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 },
            )
            const existingComment = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker),
            )

            if (existingComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existingComment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Delete preview versions
        run: |
          workers="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers?per_page=100")"
          worker_id="$(jq --exit-status --raw-output --arg name someday \
            '.result[] | select(.name == $name) | .id' <<< "$workers")"

          version_ids=()
          page=1

          while true; do
            versions="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$worker_id/versions?per_page=100&page=$page")"

            while read -r version_id; do
              version_ids+=("$version_id")
            done < <(jq --raw-output --arg tag "$PREVIEW_TAG" \
              '.result[] | select(.annotations["workers/tag"] == $tag) | .id' \
              <<< "$versions")

            total_pages="$(jq --raw-output '.result_info.total_pages // 1' <<< "$versions")"
            ((page >= total_pages)) && break
            ((page += 1))
          done

          for version_id in "${version_ids[@]}"; do
            curl --fail --silent --show-error --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$worker_id/versions/$version_id"
          done
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
