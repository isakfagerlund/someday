name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check
        env:
          OPENAI_API_KEY: test

      - run: npx wrangler deploy --dry-run
        env:
          OPENAI_API_KEY: test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply someday --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check production health
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "${PRODUCTION_URL%/}/health"
          home_page="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "${PRODUCTION_URL%/}/")"
          ! grep -q 'redirect_url=http%3A' <<< "$home_page"
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
